openapi: 3.1.0
info:
  title: StitchSense Platform API
  version: 0.1.0
  description: Shared API contract for StitchSense web, iOS, and Android clients.
servers:
  - url: https://api.stitchsense.example
    description: Production placeholder
  - url: http://localhost:8080
    description: Local Docker
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /auth/register:
    post:
      security: []
      summary: Create a StitchSense account
      responses:
        "201":
          description: Account created
  /auth/login:
    post:
      security: []
      summary: Sign in and receive access/refresh tokens
      responses:
        "200":
          description: Signed in
  /auth/refresh:
    post:
      security: []
      summary: Rotate refresh token and receive a new access token
      responses:
        "200":
          description: Token refreshed
  /auth/wordpress:
    post:
      security: []
      summary: Trusted WordPress bridge login/bootstrap endpoint
      responses:
        "200":
          description: WordPress-linked user authenticated
        "401":
          description: Invalid WordPress bridge secret
        "400":
          description: WordPress site URL does not match the configured bridge site
  /me:
    get:
      summary: Current user profile
      responses:
        "200":
          description: Current user
  /me/entitlements:
    get:
      summary: Current user access and paywall state
      responses:
        "200":
          description: Current entitlement decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
  /user/export:
    get:
      summary: Export current user's StitchSense data
      description: >-
        Returns the authenticated user's account profile, subscription status, patterns, projects
        (counters, work log, marks, photos), stash, chats and messages, rewrites, settings, and
        linked-service metadata. Connection tokens, password hashes, and store transaction IDs are
        excluded. The mobile app saves this response as a JSON file chosen by the user.
      responses:
        "200":
          description: Data export
  /user/delete-data:
    post:
      summary: Delete or archive current user's StitchSense data
      responses:
        "202":
          description: Delete accepted
  /patterns:
    get:
      summary: List the current user's patterns
      description: >-
        Each pattern also carries `file_access_url` and `parent_file_access_url`: six-hour signed
        WordPress links for files stored in WordPress uploads that the user owns, or null. The stored
        `file_url` is the permanent address and is not directly downloadable. Pattern create, get and
        update responses include the same fields, and signed links sent back as `fileUrl` are stored as
        the permanent address.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pattern list
    post:
      summary: Create or save pattern metadata
      responses:
        "201":
          description: Pattern saved
  /patterns/{id}:
    get:
      summary: Get pattern detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pattern detail
    put:
      summary: Update pattern metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pattern updated
    delete:
      summary: Archive a pattern
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Pattern archived
  /patterns/{id}/file:
    post:
      summary: Upload or replace the pattern file
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternFileUploadResponse"
  /patterns/{id}/file-url:
    get:
      summary: Get a short-lived signed pattern file URL
      description: >-
        Object-storage files return a 15-minute signed `/files/signed` link on the public API (object storage
        is never exposed to clients). Files stored in WordPress uploads return a
        15-minute signed WordPress link when the user owns the file, judged by the `user-<id>` folder or the
        legacy owner registry; otherwise 404.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Signed URL
        "404":
          description: Pattern not found, or its WordPress file is not owned by the user
  /files/signed:
    get:
      summary: Download a stored file through a signed link
      description: >-
        Links are issued by `/patterns/{id}/file-url` and in project `photo_url` / `latest_photo_url` and stash
        `image_url` fields, after the issuing route has checked ownership. No session is needed. The link is an
        HMAC over the object key and expiry (15 minutes), keyed by a value derived from `JWT_SECRET`. PDFs, plain
        text and JPEG/PNG/WebP images are served inline; anything else is sent as a download.
      security: []
      parameters:
        - { name: k, in: query, required: true, schema: { type: string }, description: Object key, base64url }
        - { name: e, in: query, required: true, schema: { type: string }, description: Expiry, Unix seconds }
        - { name: s, in: query, required: true, schema: { type: string }, description: Signature, hex }
      responses:
        "200":
          description: File contents
        "403":
          description: Link expired, tampered with, or malformed
        "404":
          description: The stored object no longer exists
  /patterns/{id}/chats:
    get:
      summary: List chat sessions for a pattern
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Chat sessions
  /chats:
    post:
      summary: Create a chat session
      responses:
        "201":
          description: Chat created
  /chats/{id}/messages:
    get:
      summary: List chat messages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Messages
    post:
      summary: Send a message through the StitchSense workflow engine
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Message saved and AI response returned
  /rewrites:
    post:
      summary: Generate and save a rewrite
      responses:
        "201":
          description: Rewrite created
  /patterns/{id}/rewrites:
    get:
      summary: List rewrites for a pattern
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Rewrite list
  /vision/analyse:
    post:
      summary: Analyse a stitch/photo via n8n
      responses:
        "201":
          description: Analysis result
  /sync:
    get:
      summary: Return all changes since a timestamp
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sync payload
  /events:
    post:
      summary: Record a mobile/web client event for analytics or error reporting
      responses:
        "202":
          description: Event accepted
  /billing/checkout:
    post:
      summary: Create Stripe checkout for web clients
      responses:
        "201":
          description: Checkout session
  /billing/webhook:
    post:
      security: []
      summary: Stripe webhook endpoint
      responses:
        "200":
          description: Webhook accepted
  /billing/revenuecat/webhook:
    post:
      security: []
      summary: RevenueCat webhook endpoint for native app-store subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhookRequest"
      responses:
        "200":
          description: Webhook accepted, replayed, or intentionally ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatWebhookResponse"
        "401":
          description: Invalid RevenueCat authorization header
  /billing/revenuecat/sync:
    post:
      summary: Sync the authenticated user's RevenueCat subscriber state into backend entitlements
      responses:
        "200":
          description: Current backend entitlement after sync
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "401":
          description: Authentication required
        "502":
          description: RevenueCat subscriber sync failed
  /admin/users/access:
    get:
      summary: List users with resolved manual, store, or trial access state
      responses:
        "200":
          description: User access summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAccessList"
  /admin/entitlements:
    get:
      summary: List manual entitlement grants
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualEntitlementGrantList"
    post:
      summary: Grant manual lifetime or timed access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualEntitlementGrantRequest"
      responses:
        "201":
          description: Grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualEntitlementGrantResponse"
  /admin/entitlements/{id}:
    delete:
      summary: Revoke a manual entitlement grant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Grant revoked
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EntitlementResponse:
      type: object
      required: [entitlement]
      properties:
        entitlement:
          $ref: "#/components/schemas/Entitlement"
    Entitlement:
      type: object
      required: [status, accessSource, features]
      properties:
        plan:
          type: string
        status:
          type: string
          enum: [active, trialing, expired]
        accessSource:
          type: string
          enum: [manual_lifetime, manual_trial, courtesy_access, stripe, apple, google, standard_trial, none]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        features:
          type: object
          additionalProperties:
            type: boolean
    AdminUserAccessList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserAccessSummary"
    AdminUserAccessSummary:
      type: object
      required: [platformUserId, email, role, entitlement, subscription]
      properties:
        platformUserId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
        wpUserId:
          type: string
          nullable: true
        siteUrl:
          type: string
          nullable: true
        entitlement:
          $ref: "#/components/schemas/AdminEntitlementSummary"
        subscription:
          $ref: "#/components/schemas/AdminSubscriptionSummary"
    AdminEntitlementSummary:
      type: object
      required: [plan, status, accessSource, trialEndsAt]
      properties:
        plan:
          type: string
        status:
          type: string
          enum: [active, trialing, expired]
        accessSource:
          type: string
          enum: [manual_lifetime, manual_trial, courtesy_access, stripe, apple, google, standard_trial, none]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
    AdminSubscriptionSummary:
      type: object
      required: [status, currentPeriodEnd, metadata]
      properties:
        status:
          type: string
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    RevenueCatWebhookRequest:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/RevenueCatWebhookEvent"
    RevenueCatWebhookEvent:
      type: object
      required: [id, type, app_user_id]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
        app_user_id:
          type: string
          description: Must equal the StitchSense backend user ID.
        store:
          type: string
          enum: [APP_STORE, MAC_APP_STORE, PLAY_STORE]
        product_id:
          type: string
        period_type:
          type: string
        transaction_id:
          type: string
        original_transaction_id:
          type: string
        expiration_at_ms:
          type: number
          nullable: true
        purchased_at_ms:
          type: number
          nullable: true
        cancel_reason:
          type: string
        expiration_reason:
          type: string
        entitlement_ids:
          type: array
          items:
            type: string
    RevenueCatWebhookResponse:
      oneOf:
        - type: object
          required: [received]
          properties:
            received:
              type: boolean
            replayed:
              type: boolean
        - type: object
          required: [ignored, reason]
          properties:
            ignored:
              type: boolean
            reason:
              type: string
    ManualEntitlementGrantType:
      type: string
      enum: [lifetime_pro, extended_trial, courtesy_access]
      description: Admin-assigned access type. Public mobile checkout does not expose a lifetime product.
    ManualEntitlementGrantRequest:
      type: object
      required: [userId, type]
      properties:
        userId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ManualEntitlementGrantType"
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          maxLength: 500
    ManualEntitlementGrant:
      type: object
      required: [id, user_id, type, starts_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ManualEntitlementGrantType"
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
    ManualEntitlementGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ManualEntitlementGrant"
    ManualEntitlementGrantResponse:
      type: object
      required: [grant]
      properties:
        grant:
          $ref: "#/components/schemas/ManualEntitlementGrant"
    PatternFileUploadResponse:
      type: object
      required: [fileKey, fileSize, storageProvider, indexed, indexingError]
      properties:
        fileKey:
          type: string
        fileSize:
          type: integer
          nullable: true
        storageProvider:
          type: string
          nullable: true
        projectId:
          type: string
          nullable: true
        fileId:
          type: string
          nullable: true
        jobId:
          type: string
          nullable: true
        indexed:
          type: boolean
          description: True only when the upload workflow produced scoped pattern identifiers for AI retrieval.
        indexingError:
          type: string
          nullable: true
          description: Workflow failure detail when the file was stored but not indexed.
