services:
  api:
    build:
      context: ./stitchsense-api
    container_name: stitchsense-api-staging
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: "1.00"
    mem_limit: 512m
    mem_reservation: 192m
    env_file:
      - ./stitchsense-api/.env.staging
    ports:
      - "127.0.0.1:4447:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - staging
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: stitchsense-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: stitchsense_staging
      POSTGRES_USER: stitchsense_staging
      POSTGRES_PASSWORD: ${STITCHSENSE_STAGING_POSTGRES_PASSWORD:?set in .env.staging.compose}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - stitchsense_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitchsense_staging -d stitchsense_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - staging

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: stitchsense-minio-staging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STITCHSENSE_STAGING_MINIO_ROOT_USER:?set in .env.staging.compose}
      MINIO_ROOT_PASSWORD: ${STITCHSENSE_STAGING_MINIO_ROOT_PASSWORD:?set in .env.staging.compose}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - stitchsense_staging_minio:/data
    networks:
      - staging

networks:
  staging:
    name: stitchsense_staging

volumes:
  stitchsense_staging_postgres:
  stitchsense_staging_minio:
