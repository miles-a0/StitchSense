services:
  api:
    build:
      context: ./stitchsense-api
    env_file:
      - ./stitchsense-api/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stitchsense
      POSTGRES_USER: stitchsense
      POSTGRES_PASSWORD: stitchsense
    ports:
      - "5433:5432"
    volumes:
      - stitchsense_postgres:/var/lib/postgresql/data
      - ./stitchsense-api/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stitchsense
      MINIO_ROOT_PASSWORD: stitchsense-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stitchsense_minio:/data

volumes:
  stitchsense_postgres:
  stitchsense_minio:
