services:
  api:
    build:
      context: ./stitchsense-api
    container_name: stitchsense-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: "1.50"
    mem_limit: 768m
    mem_reservation: 256m
    env_file:
      - ./stitchsense-api/.env.vps
    ports:
      - "127.0.0.1:4445:8080"
    networks:
      - default
      - reverse_proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: stitchsense-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?set in stitchsense-api/.env.vps}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?set in stitchsense-api/.env.vps}
    ports:
      - "127.0.0.1:9075:9000"
      - "127.0.0.1:9076:9001"
    volumes:
      - stitchsense_minio_data:/data
    networks:
      - default

networks:
  reverse_proxy:
    external: true
    name: my-main-net

volumes:
  stitchsense_minio_data:
