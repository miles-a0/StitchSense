name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
        env:
          POSTGRES_DB: stitchsense_test
          POSTGRES_USER: stitchsense_test
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stitchsense_test -d stitchsense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Mobile App/backend/stitchsense-api
    env:
      TEST_DATABASE_URL: postgres://stitchsense_test:integration-test-only@127.0.0.1:5432/stitchsense_test
      OBJECT_STORAGE_PROVIDER: s3mock
      OBJECT_STORAGE_BUCKET: stitchsense-test-patterns
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9090
      OBJECT_STORAGE_ACCESS_KEY: stitchsense-test
      OBJECT_STORAGE_SECRET_KEY: stitchsense-test-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.23.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: Mobile App/backend/stitchsense-api/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify container-safe backend npm scripts
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const scriptName of ['build', 'start']) {
            const script = pkg.scripts?.[scriptName] ?? '';
            if (script.includes('run-with-node22.sh')) {
              throw new Error(`${scriptName} must be usable inside the Docker build context and runtime image`);
            }
          }
          NODE

      - name: Check backend deployment scripts
        run: bash -n ../scripts/smoke-api.sh

      - name: Start isolated S3-compatible object storage
        shell: bash
        run: |
          docker run --detach \
            --name stitchsense-test-s3 \
            --publish 127.0.0.1:9090:9090 \
            --env COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS="$OBJECT_STORAGE_BUCKET" \
            adobe/s3mock:5.2.2@sha256:e7c36014dcf4c7f0f6bec9de888477d1d9b8f55eceb7d9c1186f70d7aadf81ca
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:9090/favicon.ico >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs stitchsense-test-s3
          exit 1

      - name: Build and test, including cross-user authorization
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  expo:
    name: Expo lint, types, dependencies, and Doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Mobile App/stitchsense-expo
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.23.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: Mobile App/stitchsense-expo/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Expo package compatibility
        run: npx expo install --check

      - name: Verify Expo release configuration defaults
        run: node ./scripts/validate-release-config.mjs

      - name: Verify Expo store release configuration gate
        env:
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: appl_ci_public_key
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: goog_ci_public_key
        run: npm run check:release-config

      - name: Verify screenshot capture helper
        run: npm run check:capture-script

      - name: Verify mobile release artifacts
        run: npm run check:mobile-artifacts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Block critical dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  php:
    name: PHP syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint tracked PHP files
        shell: bash
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the release tree for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --verbose

  operations:
    name: Operations artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate monitoring alert rules YAML
        run: |
          ruby -e 'require "yaml"; data = YAML.load_file("ops/monitoring/stitchsense-alerts.yml"); raise "missing groups" unless data.is_a?(Hash) && data["groups"].is_a?(Array)'

      - name: Validate monitoring dashboard JSON
        run: |
          ruby -e 'require "json"; data = JSON.parse(File.read("ops/monitoring/stitchsense-dashboard.json")); raise "missing panels" unless data.is_a?(Hash) && data["panels"].is_a?(Array) && !data["panels"].empty?'

      - name: Validate production readiness artifacts
        run: node tools/validate-production-artifacts.mjs

  production-image:
    name: Production image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend, expo, php, secrets, operations]
    defaults:
      run:
        working-directory: Mobile App/backend/stitchsense-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build --pull=false --tag stitchsense-api:${{ github.sha }} .
