name: Production uptime checks

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime-checks
  cancel-in-progress: false

env:
  PRODUCTION_API_BASE_URL: https://stitchsense.zu-auto.co.uk

jobs:
  api-readiness:
    name: Public API health and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --location \
              --max-time 10 \
              --retry 2 \
              --retry-delay 5 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$PRODUCTION_API_BASE_URL/health"
          )"
          if [[ "$status" != "200" ]]; then
            echo "Expected /health HTTP 200, got $status"
            sed -n '1,40p' "$response_file"
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload.get("ok") is True, payload
          assert payload.get("service") == "stitchsense-api", payload
          PY

      - name: Check public deep readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --location \
              --max-time 15 \
              --retry 2 \
              --retry-delay 5 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$PRODUCTION_API_BASE_URL/ready"
          )"
          if [[ "$status" != "200" ]]; then
            echo "Expected /ready HTTP 200, got $status"
            sed -n '1,80p' "$response_file"
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload.get("ok") is True, payload
          assert payload.get("service") == "stitchsense-api", payload
          checks = payload.get("checks") or {}
          assert checks.get("database") is True, payload
          assert checks.get("storage") is True, payload
          PY

      - name: Notify uptime alert webhook
        if: failure()
        env:
          UPTIME_ALERT_WEBHOOK_URL: ${{ secrets.UPTIME_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UPTIME_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "UPTIME_ALERT_WEBHOOK_URL is not configured; relying on GitHub workflow failure notification."
            exit 0
          fi

          payload="$(
            python3 - <<'PY'
          import json
          import os

          message = {
              "text": "StitchSense production uptime check failed.",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "runUrl": os.environ["RUN_URL"],
              "apiBaseUrl": os.environ["PRODUCTION_API_BASE_URL"],
          }
          print(json.dumps(message, separators=(",", ":")))
          PY
          )"

          curl --fail --silent --show-error \
            --max-time 10 \
            --retry 2 \
            --header 'content-type: application/json' \
            --data "$payload" \
            "$UPTIME_ALERT_WEBHOOK_URL"
