name: Production uptime checks

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime-checks
  cancel-in-progress: false

env:
  PRODUCTION_API_BASE_URL: https://stitchsense.zu-auto.co.uk

jobs:
  api-readiness:
    name: Public API health and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public API health and readiness
        env:
          STITCHSENSE_API_BASE_URL: ${{ env.PRODUCTION_API_BASE_URL }}
          STITCHSENSE_METRICS_SHARED_SECRET: ${{ secrets.METRICS_SHARED_SECRET }}
        shell: bash
        run: '"Mobile App/backend/scripts/smoke-api.sh"'

      - name: Notify uptime alert webhook
        if: failure()
        env:
          UPTIME_ALERT_WEBHOOK_URL: ${{ secrets.UPTIME_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UPTIME_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "UPTIME_ALERT_WEBHOOK_URL is not configured; relying on GitHub workflow failure notification."
            exit 0
          fi

          payload="$(
            python3 - <<'PY'
          import json
          import os

          message = {
              "text": "StitchSense production uptime check failed.",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "runUrl": os.environ["RUN_URL"],
              "apiBaseUrl": os.environ["PRODUCTION_API_BASE_URL"],
          }
          print(json.dumps(message, separators=(",", ":")))
          PY
          )"

          curl --fail --silent --show-error \
            --max-time 10 \
            --retry 2 \
            --header 'content-type: application/json' \
            --data "$payload" \
            "$UPTIME_ALERT_WEBHOOK_URL"
